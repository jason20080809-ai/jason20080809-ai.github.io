<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我｜陳志豪 ・ 消防員攝影師</title>
  <meta name="description" content="與消防員攝影師陳志豪聯絡 — 拍攝邀約、展覽與授權洽詢。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="flame">&#10022;</span> 陳志豪 <span style="font-weight:400;color:var(--text-muted);font-size:.82rem">FIRE &amp; LENS</span></a>
      <nav class="nav-links" aria-label="主選單">
        <a href="index.html">首頁</a>
        <a href="fire.html">消防紀實</a>
        <a href="portrait.html">人像</a>
        <a href="landscape.html">風景</a>
        <a href="about.html">關於我</a>
        <a href="contact.html">聯絡</a>
      </nav>
      <button class="nav-toggle" aria-label="開啟選單">&#9776;</button>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <div class="kicker">Contact</div>
      <h1>聯絡我</h1>
      <p>拍攝邀約、展覽合作、媒體授權，或只是想聊聊攝影，都歡迎來信。</p>
    </div>
  </section>

  <main class="section">
    <div class="container">
      <div class="contact-wrap">
        <a class="contact-card" href="mailto:hello@fireandlens.tw">
          <span class="contact-icon">&#9993;</span>
          <div>
            <h3>Email</h3>
            <p>hello@fireandlens.tw</p>
            <p>來信後 2–3 個工作天內回覆</p>
          </div>
        </a>
        <a class="contact-card" href="#" aria-label="Instagram">
          <span class="contact-icon">&#9873;</span>
          <div>
            <h3>Instagram</h3>
            <p>@fireandlens</p>
            <p>最新的出勤側拍與生活照</p>
          </div>
        </a>
        <div class="contact-card">
          <span class="contact-icon">&#9742;</span>
          <div>
            <h3>拍攝地點</h3>
            <p>新北・台北・桃園</p>
            <p>外縣市可另外討論</p>
          </div>
        </div>
      </div>

      <form class="contact-form" action="#" method="post">
        <div class="section-head">
          <span class="kicker">Send a message</span>
          <h2>寫封信給我</h2>
        </div>
        <div class="form-grid">
          <div>
            <label for="name">你的名字</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="subject">主旨</label>
            <input type="text" id="subject" name="subject" placeholder="例如：人像拍攝邀約">
          </div>
          <div>
            <label for="type">需求類型</label>
            <input type="text" id="type" name="type" placeholder="拍攝／展覽／授權／其他">
          </div>
          <div class="full">
            <label for="message">內容</label>
            <textarea id="message" name="message" required placeholder="簡單描述你的需求與時間…"></textarea>
          </div>
          <div class="full">
            <button class="fill" type="submit">送出訊息 &#8594;</button>
            <p class="note">此表單為示範版，送出請改以 Email 或 IG 私訊聯絡。</p>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; <span data-year="2026"></span> 郭仁傑 Fire &amp; Lens</span>
      <div class="socials">
        <a href="#" aria-label="Instagram">&#9873;</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="Email">&#9993;</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
